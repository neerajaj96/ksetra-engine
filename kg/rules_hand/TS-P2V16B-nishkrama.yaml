id: TS-P2V16B-nishkrama
claim_en: The overlapping (nishkrama/projection) of Jagati beyond the yoni socle
  equals its own height; Kumuda takes the same projection; Pattika, Kampa, Pati
  and the rest project three-fourth, half or one-quarter of their respective heights
  to all sides; Paduka projects measured from the Jagati line.
claim_sa: यावत् स्वोत्सेधमानम् ... तत्तुल्यं ... उच्छ्रयसमम् ... पादोनम् ... अर्धांशकम्
  ... पादांशकम् ... मानसूत्रात् समन्ताच्चतुर्दिशं बहिर्गमयेत्
rule_type: measure
params:
  jagati_projection: = jagati_height
  kumuda_projection: = jagati_projection
  other_projections: [0.75, 0.5, 0.25]
  other_members: [pattika, kampa, pati]
  paduka_datum: jagati_line
  extent: all_four_sides_from_mana_sutra
