id: TS-P1V60B-vastumandala
claim_en: >-
  Lay the vastumandala: ten sutra lines lengthwise and breadthwise making nine
  chambers; center nine padas as svastika or eight-petalled lotus; outer ring
  six padas on cardinals, paired padas on corners (agni/vayu E-W, others N-S);
  strew darbha per pada; worship the pitha, then Vastupurusha first with 'Om vam
  vastupurushaya namah' and vamadi anga-mantras.
