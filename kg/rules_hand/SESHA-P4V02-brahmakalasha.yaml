id: SESHA-P4V02-brahmakalasha
claim_en: >-
  Brahma-kalasha worship in brief: bathed and sipping, seated by the kalasha,
  self-purified guru worships vishtara then invokes prakriti; astra-prokshana
  of the kumbha, nyasa of vali-surya-soma kalas at three stations, kumbha
  invocation; then karcha (kusa bunch) with dravya placed, manasa purana
  and jala purana.
