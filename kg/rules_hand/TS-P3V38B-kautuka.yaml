id: TS-P3V38B-kautuka
claim_en: >-
  Standing with darbha-grass anjali, pray with the two mantras, take the
  kautuka - white wool thread binding kshauma cloth holding pearl, mustard and
  gold - wind it seven times with thumb and ring fingers while murmuring its
  own anu-mantra, and tie the mighty, auspicious, all-protecting bracelet on
  the idol's right (principal) arm at the mantra's end, after its
  astra-sprinkling, drying, worship and charming.
rule_type: sequence
params:
  prep: [darbha_anjali, two_mantras]
  kautuka: [white_wool_thread, kshauma_cloth, pearl_mustard_gold]
  winding: 7_rounds_thumb_ring_fingers
  japa: own_anu_mantra
  tie_on: right_principal_arm_at_mantra_end
  consecration: [astra_prokshana, shoshana, puja, abhimantrana]
  power: [mahavirya, mangalya, sarva_rakshakara]
applicability: Tantrasamuccaya Patala 3, verse 38; verse + Vimarshini + Vivarana.
  Hand-reviewed (kautuka batch).
