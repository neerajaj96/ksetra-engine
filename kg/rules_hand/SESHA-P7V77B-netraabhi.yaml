id: SESHA-P7V77B-netraabhi
claim_en: >-
  Anoint with ghee by mula, purify each with masura-pishta and waters, open the
  eyes with the netra-mantra; worship the vishtara/pitha seat with own mantras,
  perform avahana and padya; abhisheka with one's own purified kumbhas in the
  purana order, smear gandha-heaps, and give clothing and the rest in order with
  the dhruva-panchaka mantra - then the full upachara chain (uttariya, bhushana,
  padya, arghya, achamana, jala-gandha-pushpa, dhupa, deepa, pranati).
