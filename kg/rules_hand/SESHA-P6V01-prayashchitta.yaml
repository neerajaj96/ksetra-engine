id: SESHA-P6V01-prayashchitta
claim_en: >-
  On triggers like the idol's fall, entry of outcastes, or bloodshed in the
  courtyard, perform expiation at once: first purify the place (sthana-shuddhi),
  then the image (pratima-shuddhi) if affected, in order by the adept preceptor;
  remedies include digging, removal, burning, filling and cow-dwelling
  (go-nivasana).
claim_sa: ... बिम्बस्य पतनं वा ... चण्डालादीनां गृहप्रवेशनं वा ... असृक्पातो वा
  ... सपदि ... प्रायश्चित्तं कुर्यात् ... स्थानं शोध्यं, ... प्रतिमा च शोध्या ...
  खननं हरणं दाहः पूरणं गोनिवासनम् ... ।। १ ।।
