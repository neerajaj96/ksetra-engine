id: TS-P2V23B-kudyastambha
claim_en: >-
  Kudya (wall) pillars of god-houses from three hastas up: one on each of the
  four corners and two between each pair (twelve total) at equal intervals, beams
  (uttara) fixed over them; shrines of eleven karas and above take twenty
  pillars of varied shapes and decoration. Unequal pillar spacing destroys the
  vastu.
claim_sa: ... कोणचतुष्कमध्यविनिवेश्याः ... द्वादश स्तम्भाः ... समान्तराः ...
  एकादशकरादिषु ... विंशतिः ... एषु स्तम्भेषूत्तरमर्पयेत् ... ।। 23 ।।
rule_type: structure
params:
