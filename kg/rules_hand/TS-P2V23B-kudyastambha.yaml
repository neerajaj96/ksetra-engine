  layout: corners_4_plus_2_between_each
  spacing: equal
  eleven_kara_plus: 20
  beam: uttara_over_pillars
  violation: unequal_spacing_destroys_vastu
applicability: Tantrasamuccaya Patala 2, verse 23; verse + Vimarshini
