id: TS-P2V52B-alpa8
claim_en: >-
  In a small (alpa) temple, double the width-derived height and divide by eight:
  the lowest share forms the masuraka/adhisthana socle, two shares the stambha
  (pillar/wall), one share the prastara, one share the gala recess, two shares
  the shikhara roof and one share the stupika finial (1+2+1+1+2+1).
claim_sa: >-
  ... विस्तृतिद्विगुणितप्रायोच्छ्रये ... अष्टशिते सति । मूलांशेन ... मसूरकोच्छ्रयम्
  ... व्यंशतः स्तम्भोच्छ्रयम्, भूयोंऽशतः प्रस्तरम् ... एकांशेन ... गल ... भागाभ्यां
  शिखरोच्छ्रयम्, एकांशतः स्तूपिकाम् ... ।। 52 ।।
rule_type: proportion
params:
