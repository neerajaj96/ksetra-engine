id: KALASHA-P1V28-bijadevata
claim_en: >-
  Worship karisha-valuka-mritsna (dung/sand/earth layers) with Tara-mantra,
  then the deities of the separated seeds; in the palikas worship in order
  Vishnu, Brahma, Shiva, Yama, Vishnu, Shiva, Aditya, Skanda, Kamalalaya,
  Vayu, Indra, Soma, Agni as the seed-deities.
