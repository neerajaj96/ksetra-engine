id: NARAYANA-P1V00-bhutabali
claim_en: >-
  Before invoking Vishnu's abode: offer the bhuta-kura-bali and recite - whether
  bhutas or rakshasas, whoever stands here, let them all depart; we make the
  abode of Hari. Then dig a pit of a man's measure, place a grain-kumbha, and
  set silver tortoise and golden (kurma) faces upon its mouth.
claim_sa: भूतकूरबलि दत्वा दृष्ट्वेमं मन्त्रमुच्चरेत् । भूतानि राक्षसावापि येत्र
  तिष्ठन्ति केचन । ते सर्वं व्यपगच्छन्तु कुर्महे भवनं हरेः ।। (verses unnumbered
  in OCR; Patala 1 Vaishnava section)
