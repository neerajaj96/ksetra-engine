id: SESHA-P3V02-mantramula
claim_en: >-
  Brahma mula-mantra construction: first tara (pranava), then nati, then the
  own name in dative (Brahmane); with tatsad before nati it becomes the
  eight-syllable (nagavarna/ashtakshara), and with tatsannamo inside the
  twelve-syllable arka-varna (dvadashakshara).
