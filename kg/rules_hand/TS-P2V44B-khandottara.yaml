  Wall plates (uttara) are threefold: Khandottara best (width and height equal
  to pillar width), Patrottara middling (thickness three-fourth, i.e. a pada
  less), Rupottara lowest (half thickness); chulika fixing follows with
  Ghana-tati inversion option.
