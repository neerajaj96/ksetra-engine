id: TS-P4V105B-durgaabhi
claim_en: >-
  After punyaha-sprinkling with the five Durga anu-mantras, clothe (the Durga
  image) in a red silk pair; offer deepa, alankara, vitana, chamara-pair and
  chatra; wave lights (nirajana) in the quarters from east to zenith with 'ayam
  puro harikesha' and the rest; then hymn her with own-agama mantras.
