id: KALASHA-P2V151-homaclose
claim_en: >-
  Offer the eight ghee substances to fullness; finishing the homa remainder,
  pour sampata into the kalasha; dismiss the fire, lodge the god, install
  tattvas in the kalasha and arrange protection; then with fresh garments,
  upper cloth and pavitra-ringed hands (proceed to nandimukha rites).
claim_sa: सर्पिद्रव्याण्येवमष्ट हुनेद्यद्रासपूर्णकम् ।। १५१ ।। होमशेषं समाप्याथ
  सम्पातं कलशेऽप्य च । उद्वास्य वह्निगं देवं कलशेऽग्निं विसर्जयेत् ।। १५२ ।।
  तत्त्वानि न्यस्य कलशम् इष्ट्वा रक्षां प्रकल्पयेत् । नववासाः सोत्तरीयः
  सपवित्रकरस्ततः ।। १५३ ।।
