id: TS-P2V19B-walls
claim_en: The outer wall thickness is one-eighth of the shrine perimeter and the
  inner wall one-eighth of the garbhagriha; a nadi corridor runs all around
  between the two walls; in a small shrine the two walls may be merged into one
  solid (ghana) wall.
claim_sa: बाह्या गृहव्यासगजांशतः स्याद् भित्तिः परा गर्भगजांशतश्च । नाडी समन्तादुभयान्तराले
  संमेल्य वा भित्तियुगं गृहेऽल्पे ।। 19 ।।
