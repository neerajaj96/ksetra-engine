  Matri gayatris in order: Indrani (bija lam-li-lu, Indra-bhuta, vajra-handed),
  Bhadrakali (bija dram-dri-dru, Rudra-bhuta, shakti-handed), then the crore on
  crore ganas (all hosts) with joint obeisance to them, male and female.
