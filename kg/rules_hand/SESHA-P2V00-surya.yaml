id: SESHA-P2V00-surya
claim_en: >-
  For Surya: perform upasthana with his own anga and mula, place the
  khashotka-mantra and japa in the heart, nyasa of the ten-tara body and the
  ten pranava-gayatri; at Rama-upasthana time recite the pratishtha mantra
  (pratishthasi pratishtha ...).
claim_sa: सूर्यं उपस्थानविधैः ... स्वाङ्गं स्वमूलं ... हृदि न्यस्येत् । देहं
  दशतारकां दशप्रणवगायत्रीं च न्यसेत् । ... प्रतिष्ठासि प्रतिष्ठेत्यादिमन्त्रं च वदेत् ।
