id: SESHA-P4V04-parikalasha
claim_en: >-
  Parikalasha manner: knowing each dravya-devata-mantra, in the middle kumbhas
  of each parikhanda perform pitha-reshthi, kumbha-parishuddhi and puja,
  karcha offering, dravya offering, manasa and jala purana; then project the
  two murtis (sthula/sukshma), invoke mantra-chaitanya, worship with
  anga-avarana and guard.
