id: SESHA-P6V98B-parivaraanga
claim_en: >-
  Take the deity's limbs (anga) together at bimba-graha - dauvarikas, lokapala-
  pithas, matrika-lingas, the vahana (Garuda/vrishabha etc.), the lap/pitha Devi;
  purify them with its shodhana, adhivasana in its own mandapa, pratishtha each
  in its own place after kalasha-snana and avasruta-sechana; snapana the vahana
  with the remaining waters at devabhisheka.
