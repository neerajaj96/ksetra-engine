id: PRAYOGA-P8V24-marks
claim_en: >-
  Reject stones bearing crooked, coarse, very rough or worm-eaten lines; prize
  stones marked nandyavarta, vasundhara, ashva, shrivatsa, kurma, shankha,
  svastika, padma, go-vrisha, chakra, indu, surya, chatra, dhvaja, linga,
  torana, mriga, prasada or dundubhi; reject crow, camel, ox, monkey, cat,
  vulture, snake, jackal, kid forms and all transverse lines as fault-bearing.
claim_sa: वक्राः स्थूलाश्चातिरूक्षाः कृदाश्च रेखा यस्यां वर्जनीया शिला सा ।। २४ ।।
  नन्द्यावर्त ... श्रीवत्स ... कूर्म ... शङ्खस्वस्तिकपद्म ... चक्रेन्दुसूर्य ...
  छत्रध्वजलिङ्गतोरण ... ।। काक ... उष्ट्र ... वानर ... मार्जारगृध्र ... सर्प ...
  शृगाल ... तिर्यगवस्थिताः ... दोषावहाः ... ।। २६ ।।
