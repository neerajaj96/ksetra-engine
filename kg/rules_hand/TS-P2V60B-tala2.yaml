id: TS-P2V60B-tala2
claim_en: >-
  On the second storey place kutas at the corners (vidisha) and salas in the
  cardinal directions, with pairs of nasi dormers between sala and kuta; on the
  four sides set Brahma in the east, Dakshinamurti in the south, Narasimha in
  the west and Krishna (or Skanda) in the north, in wood or stone; great nasis
  crown the conical roof above.
claim_sa: तले द्वितीये ... विदिशासु कूटान्, दिशासु शालाश्च ... द्विशो नासीः ...
  दिशासु ... ब्रह्माद्या मूर्तयः ... तदूर्ध्वगतशिखरे महानासीः ... ।। 60 ।।
