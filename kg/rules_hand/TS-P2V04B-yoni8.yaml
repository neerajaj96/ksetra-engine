id: TS-P2V04B-yoni8
claim_en: >-
  The eight yonis from the east in order are Dhvaja, Dhuma, Simha, Kukkura,
  Vrisha, Khara, Gaja, Vayasa; the odd ones (Dhvaja, Simha, Vrisha, Gaja) bring
  prosperity, the even ones (Dhuma, Kukkura, Khara, Vayasa) misfortune. Fractional
  (non-integral) yoni results are not to be adopted; only whole yonis count.
claim_sa: प्रागादियोनयोऽष्टौ ... ध्वजधूमसिंहकुक्कुरवृषखरगजवायसाः ... तेष्वयुजः
  सम्पदे युजो विपदे ।। 4 ।।
