id: TS-P1V04B-yajamana
claim_en: >-
  The patron (yajamana) undertaking image-installation for daily worship shall be
  devoted to the duties prescribed for his varna and ashrama, possessed of wealth
  earned by proper means, and shall first of all choose (varana) an excellent
  preceptor (guruvara).
