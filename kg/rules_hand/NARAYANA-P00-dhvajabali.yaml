id: NARAYANA-P00-dhvajabali
claim_en: >-
  Offer bali at the dhvaja base for Pingala and the retinue - Mahanada,
  Mahakala, Bhutanatha the mighty, Yaksha, Daksha, Vishalaksha, Rudravaktra,
  Bhavodbhava - in the eight directions and center on the balipitha; on
  tirtha-yatra nights offer the great bali, and scatter village bali with the
  Pingala mantra.
claim_sa: एवं तु पिङ्गलादीनां ध्वजमूले बलि हरेत् । महानाद महाकालं भूतनाथं
  महाबलम् ।। यक्षं दक्षं विशालाक्षं रुद्रवक्त्रं भवोद्भवम् । दिक्ष्वष्टासु च तन्मध्ये
  बलिपीठस्य तान्यजेत् ।।
