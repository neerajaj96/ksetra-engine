id: SESHA-P7V70B-nidrakalasha
claim_en: >-
  Worship the shayya, then at its head honor the svapna/nidra-kalasha with the
  mula-mantra; worship the Vidyeshvaris (Mahamaya-adi) in order in directional
  kalashas; around Mothers' shayyas set ashtamangalas, mangala-palikas and rows
  of lamps; honor the eight shaktis with their mantras.
