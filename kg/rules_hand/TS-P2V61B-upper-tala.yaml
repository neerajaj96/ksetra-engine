id: TS-P2V61B-upper-tala
claim_en: >-
  Above the gala (as in a third storey too) the upper-storey wall is thinner
  than the first-storey wall; set wall plate and beam, fix rafters uniting with
  the lower rafter tips, the upper rafters overlapping half the pillar height;
  upper pillars stand on the lower beams (tula).
