id: TS-P2V118B-nala
claim_en: >-
  At the lotus-seat base set a tubular nala stem, square-topped, twenty, twentyone
  or twentytwo pratima-angulas broad with the top reduced by one-eighth, one-seventh
  or one-sixth, long enough to hold the idol; the nala is Brahma-ruled for all
  deities, but round-shaped it is Shiva-ruled (Rudra-devata).
claim_sa: ... विंशत्या वा सैकया विंशत्या वा सद्विकया विंशत्या वा ... प्रतिमाङ्गुलैः
  ... नालमारचयतु ... अष्टांशेन वा सप्तांशेन वा षडंशेन वा हीन ... नपुंसकशिलापर्यन्त ...
  ... वृत्तं शिवात्मकं ... ।। 118 ।।
