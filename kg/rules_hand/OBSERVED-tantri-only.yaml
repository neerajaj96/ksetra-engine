id: OBSERVED-tantri-only
claim_en: >-
  After prana-pratishtha only the Tantri (ritual authority) and the Melshanti
  (chief priest) cross the sopanam into the sreekovil; all others - including
  the sevaka/yajamana - serve from the namaskara-mandapa (flowers, ghee, guard
  duty). Dvarapalakas enforce it; a physical barrier blocks entry.
