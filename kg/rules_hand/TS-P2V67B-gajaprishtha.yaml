id: TS-P2V67B-gajaprishtha
claim_en: >-
  For a Gajaprishtha (elephant-back: square + semicircle apse) temple: divide
  the desired circumference by sixty-four, drop one share; divide the rest by
  eighteen; with four shares each shape the two sides and the front width;
  then with a two-share compass line from the side-ends draw the semicircle apse
  (about six shares in circuit).
claim_sa: ... चतुष्षष्टिभागं त्यक्त्वा ... अष्टादशधा ... चतुर्भिरंशैः पार्श्वद्वन्द्व ...
  मुखविस्तारं ... द्वयंशसूत्रभ्रमात् ... अर्धवृत्तम् ... ।। 67 ।।
