id: TS-P2V86B-metrology
claim_en: >-
  Best idols divide length by ten (dash tala), middle by nine (nava tala),
  lowest by eight (ashta tala; Devis ashtatala); one tala divided by twelve is
  the angula; two angulas a kala (with golaka); one-eighth angula is the yava.
  Best in stone, middle in wood, lowest in gem (or as desired).
