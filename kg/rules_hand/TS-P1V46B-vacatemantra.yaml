id: TS-P1V46B-vacatemantra
claim_en: >-
  Recite the prayer-mantra: spirits or demons, whoever occupy the place, let
  them all go away from the place being made an abode of Hari - substituting,
  for Hari's station, the name of the deity for whose installation the land is
  taken.
claim_sa: प्रार्थनामन्त्रं पठति भूतानीति ।। 46 ।। ... यद्यदर्थमिह गृह्यते मही तत्पदं
  हरिपदेऽत्र योजयेत् ।
rule_type: sequence
params:
