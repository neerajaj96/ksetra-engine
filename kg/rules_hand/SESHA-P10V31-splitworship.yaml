id: SESHA-P10V31-splitworship
claim_en: >-
  Before installation (no sankramana yet), keep separate canopies: on the
  mula-bimba only brief worship with nivedya alone; on the yaga-bimba full
  worship with nivedya for its completion. Next morning the preceptor does
  prasada-pratishtha rites, installs the brahma-grava stone, deposits gems
  (ratna-nyasa), installs the pitha and worships it.
