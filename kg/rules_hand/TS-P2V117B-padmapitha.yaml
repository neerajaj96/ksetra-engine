id: TS-P2V117B-padmapitha
claim_en: >-
  The lotus seat (padma-pitha), one to two talas high: divide height by six -
  first share the base slab, two shares an eight-petalled lotus; at the center
  a three-fourth-tala double petal layer; above, three talas of eight-petalled
  lotus; seat height includes the base petals.
