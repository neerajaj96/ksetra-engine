id: SESHA-P6V107B-sanga
claim_en: >-
  Sanga (with-limbs) vs niranga installation: one guru serves the chief only,
  land-taking for the chief; rakshoghna-homa rites separate, utsava always
  separate; an independent deity set with or without its limbs counts niranga;
  consorts - Saraswati with Brahma, Lakshmi with Hari, Uma with Shambhu - in
  alinda niches or sub-shrines; outer-shrine deities face the deity or share
  its direction, installed with it or in due time, each with limbs.
claim_sa: ... गुरोर्वृतिरेकस्य प्रधानस्यैव ... उत्सवस्तु पृथगेव ... स्वातन्त्रयेण
  स्थाप्यः ... निरङ्गम् ... सरस्वती ... ब्रह्मणः ... हरेर्लक्ष्मीः ... शम्भोरुमा ...
  तत्सम्मुखं तत्समदिङ्मुखं वा ... प्रतिष्ठां विदध्यात् ... ।। १०७-१११ ।।
