id: SESHA-P6V09B-exphoma
claim_en: >-
  For expiation: recite each deity's own sukta (Brahma-Hiranyagarbha, Surya-
  Saura, Vaishravana, Krishna-Vaishnava, Saraswati-Sarasvata, Lakshmi-
  Shrisukta, Gauri, Jyeshtha, Bhadrakali, Matris); do parayana and
  prayaschitta-homa; kindle fire before the deity in four, eight or twelve
  kundas by defect class; offer ghee/samidha/shali/tila/laja a thousandfold
  with mula-mantras, palasha above twelve-hundred.
claim_sa: ... निजनिजसूक्तान्येव जप्यानि ... पारायणं ततः कुर्यात् प्रायश्चित्तहुतादि
  च ... चतुर्षु वाष्टास्वथ वा द्वादशसु कुण्डेषु ... मन्त्रैः ... साहस्रं ... ।। ९-१२ ।।
