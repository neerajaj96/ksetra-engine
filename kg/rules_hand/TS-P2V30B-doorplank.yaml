id: TS-P2V30B-doorplank
claim_en: >-
  Deduct the door height from the pillar height and divide the remainder by five;
  two portions give the base cross-plank (uttara) thickness; the top lintel is
  shaped likewise (divided by nine, equal thickness); above the crossbar to the
  beam-top fix a panel bearing a goddess figure for auspiciousness.
