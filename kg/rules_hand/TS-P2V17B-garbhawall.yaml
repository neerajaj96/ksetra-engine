id: TS-P2V17B-garbhawall
claim_en: Having raised a fitting adhisthana and levelled its top with stone slabs,
  divide and construct as appropriate the garbha (sanctum) inner wall, outer wall
  and the middle nadi (corridor/cavity) between them.
claim_sa: चित्वेत्यधिष्ठानमिहानुरूपं समं तलीकृत्य शिलाप्रतानैः । विभज्य गर्भान्तरबाह्यभित्ति-
  तन्मध्यनाडी रचयेद् यथार्हम् ।। 17 ।।
