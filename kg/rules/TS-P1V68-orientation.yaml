claim_sa: हरिमहिषनिहन्त्र्योरन्तर्बहिश्चार्चने इति क्रमः स्यात्। अन्येषु पञ्चसु ।
  ईशानादि- बहिष्ठापादिधरान्तान्तरान्तरजनिष्ठः ईशानादिबहिष्ठ आपादिधरान्तान्तरोऽन्तरजनिष्ठश्च
  क्रमः स्यात् । ईशानादिद्वात्रिंशद्देवताभिर्बहिष्ठाभिर्युक्तः, आपापवत्सादिधरो महीधरः
  तदन्तो धरान्तस्ताभिर्द्वादशभिरन्तरे अन्तराले स्थिताभिर्देवताभिश्व युक्तः, अन्तरजनिष्ठः
  अन्तरस्थितब्रह्मावसितः क्रमः स्यात् ।। 68 ।।
